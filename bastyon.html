<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastyon Download</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: sans-serif;

            width: 400px; /* Ширина окна расширения */
            min-height: 300px; /* Высота окна расширения */
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        .play-btn {
            background-color: #28a745;
            color: white;
        }

        .play2-btn {
            background-color: orange;
            color: green;
        }

        .download-btn {
            background-color: #007bff;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
    <link rel="icon" href="https://bastyon.com/favicon.svg" sizes="any" type="image/svg+xml">
</head>
<body>

    <div class="container">
        <input type="text" id="linkInput" placeholder="Paste your link here...">
        <br>
        <button class="btn play-btn">PLAY</button>
        <button class="btn play2-btn">PLAY NEW TAB</button>
        <button class="btn download-btn">DOWNLOAD!</button>
        <a class="video-link" hidden="hidden" target="_self" download></a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
